services:
  - type: web
    name: nexhr
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "NexHR Notifications <onboarding@resend.dev>"
      - key: JWT_SECRET
        generateValue: true
